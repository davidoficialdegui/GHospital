<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear Usuario</title>
    <link rel="stylesheet" href="/css/estilos.css">
    <style>
        .contenedor {
            width: 520px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(0,0,0,0.12);
        }
        h1 { margin-top: 0; font-size: 22px; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input[type="text"], input[type="email"], input[type="password"], select {
            width: 100%; padding: 10px; border: 1px solid #ccc;
            border-radius: 6px; font-size: 14px; box-sizing: border-box;
        }
        .btn-crear {
            width: 100%; padding: 12px; background: #28a745;
            color: white; border: none; border-radius: 6px;
            font-size: 15px; font-weight: bold; cursor: pointer;
        }
        .btn-crear:hover { background: #1e7e34; }
        .link-volver {
            display: block; margin-top: 14px; text-align: center;
            color: #6c757d; text-decoration: none; font-size: 14px;
        }
        .link-volver:hover { text-decoration: underline; }
        .alerta-ok { background:#d1e7dd; color:#0f5132; padding:12px; border-radius:6px; margin-bottom:16px; }
        .alerta-error { background:#f8d7da; color:#842029; padding:12px; border-radius:6px; margin-bottom:16px; }
        #campo-especialidad { display: none; }
    </style>
</head>
<body>
<div class="contenedor">
    <h1>Crear nuevo usuario</h1>

    <div th:if="${mensaje}" class="alerta-ok" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alerta-error">
        <strong>Error:</strong> <span th:text="${error}"></span>
    </div>

    <form th:action="@{/admin/crear}" method="post">

        <div class="form-group">
            <label for="tipo">Tipo de usuario</label>
            <select id="tipo" name="tipo" required onchange="toggleEspecialidad(this.value)">
                <option value="">-- Seleccionar --</option>
                <option value="PACIENTE">Paciente</option>
                <option value="MEDICO">Médico</option>
                <option value="RECEPCIONISTA">Recepcionista</option>
            </select>
        </div>

        <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" placeholder="Nombre" required>
        </div>
        <div class="form-group">
            <label for="apellido1">Primer apellido</label>
            <input type="text" id="apellido1" name="apellido1" placeholder="Primer apellido" required>
        </div>
        <div class="form-group">
            <label for="apellido2">Segundo apellido</label>
            <input type="text" id="apellido2" name="apellido2" placeholder="Segundo apellido (opcional)">
        </div>
        <div class="form-group">
            <label for="dni">DNI</label>
            <input type="text" id="dni" name="dni" placeholder="12345678A" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="email@hospital.com" required>
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Contraseña" required>
        </div>

        <div class="form-group" id="campo-especialidad">
            <label for="especialidad">Especialidad médica</label>
            <input type="text" id="especialidad" name="especialidad" placeholder="Ej: Cardiología">
        </div>

        <button type="submit" class="btn-crear">Crear usuario</button>
    </form>

    <a href="/admin/usuarios" class="link-volver">← Volver a gestión de usuarios</a>
</div>

<script>
    function toggleEspecialidad(tipo) {
        document.getElementById('campo-especialidad').style.display =
            tipo === 'MEDICO' ? 'block' : 'none';
    }
</script>
</body>
</html>
