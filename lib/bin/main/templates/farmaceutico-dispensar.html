<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Dispensación</title>
    <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
    <div class="contenedor-ancho">
        <h1>Registrar Entrega de Medicamento</h1>

        <div th:if="${exito}"
             style="background:#d1e7dd; color:#0f5132; padding:15px; border-radius:8px; margin-bottom:20px;">
            <strong>Dispensación registrada correctamente.</strong>
            <div th:if="${dispensacion}" style="margin-top:10px;">
                <p style="margin:4px 0;">
                    <strong>Medicamento:</strong>
                    <span th:text="${dispensacion.medicamento}">-</span>
                </p>
                <p style="margin:4px 0;">
                    <strong>Paciente:</strong>
                    <span th:text="${dispensacion.pacienteNombre}">-</span>
                </p>
                <p style="margin:4px 0;">
                    <strong>Cantidad dispensada:</strong>
                    <span th:text="${dispensacion.cantidadDispensada}">-</span>
                </p>
                <p style="margin:4px 0;">
                    <strong>Estado:</strong>
                    <span th:text="${dispensacion.estado}">-</span>
                </p>
            </div>
        </div>

        <div th:if="${error}"
             style="background:#f8d7da; color:#842029; padding:15px; border-radius:8px; margin-bottom:20px;">
            <strong>Error:</strong> <span th:text="${error}"></span>
        </div>

        <div th:if="${exito == null or !exito}"
             style="background:#f2f4f7; border-radius:8px; padding:24px;">
            <form th:action="@{/farmaceutico/dispensar}" method="post">
                <input type="hidden" name="farmaceuticoId" th:value="${farmaceuticoId}">

                <div style="margin-bottom:16px;">
                    <label for="recetaId">ID de Receta *</label><br>
                    <input type="number" id="recetaId" name="recetaId"
                           th:value="${recetaId}" min="1" required
                           style="width:200px; margin-top:4px;">
                </div>

                <div style="margin-bottom:16px;">
                    <label for="cantidadDispensada">Cantidad dispensada *</label><br>
                    <input type="number" id="cantidadDispensada" name="cantidadDispensada"
                           min="1" required
                           style="width:200px; margin-top:4px;">
                </div>

                <div style="margin-bottom:16px;">
                    <label for="estado">Estado</label><br>
                    <select id="estado" name="estado" style="width:210px; margin-top:4px; padding:6px;">
                        <option value="DISPENSADO">DISPENSADO</option>
                        <option value="PARCIAL">PARCIAL</option>
                        <option value="PENDIENTE">PENDIENTE</option>
                    </select>
                </div>

                <div style="margin-bottom:20px;">
                    <label for="observaciones">Observaciones</label><br>
                    <textarea id="observaciones" name="observaciones" rows="3"
                              style="width:100%; max-width:500px; margin-top:4px; padding:6px;"
                              placeholder="Opcional"></textarea>
                </div>

                <button type="submit" style="background:#28a745; color:white; border:none;
                        padding:12px 24px; border-radius:4px; cursor:pointer; font-size:1em;
                        font-weight:bold;">
                    Registrar dispensación
                </button>
            </form>
        </div>

        <br>
        <a th:href="@{/farmaceutico/inicio}" style="color:#6c757d;">Volver al panel</a>
    </div>
</body>
</html>
