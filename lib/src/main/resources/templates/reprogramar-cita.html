<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reprogramar Cita</title>
    <link rel="stylesheet" href="/css/estilos.css">
    <style>
        .contenedor {
            width: 500px;
            margin: 80px auto;
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(0,0,0,0.12);
        }
        h1 { margin-top: 0; margin-bottom: 24px; font-size: 22px; }
        .info-cita {
            background: #f8f9fa;
            border-left: 4px solid #007bff;
            padding: 12px 16px;
            border-radius: 4px;
            margin-bottom: 24px;
            font-size: 14px;
            line-height: 1.7;
        }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 14px; }
        input[type="datetime-local"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .btn-guardar {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-guardar:hover { background: #0056b3; }
        .link-volver {
            display: block;
            margin-top: 14px;
            text-align: center;
            color: #6c757d;
            text-decoration: none;
            font-size: 14px;
        }
        .link-volver:hover { text-decoration: underline; }
        .alerta-error {
            background: #f8d7da; color: #842029;
            padding: 12px; border-radius: 6px; margin-bottom: 16px;
        }
    </style>
</head>
<body>
<div class="contenedor">
    <h1>Reprogramar cita</h1>

    <div th:if="${error}" class="alerta-error">
        <strong>Error:</strong> <span th:text="${error}"></span>
    </div>

    <div th:if="${cita}" class="info-cita">
        <strong>Paciente:</strong> <span th:text="${cita.pacienteNombre}">-</span><br>
        <strong>Médico:</strong> <span th:text="${cita.medicoNombre}">-</span><br>
        <strong>Especialidad:</strong> <span th:text="${cita.especialidad != null ? cita.especialidad : '-'}">-</span><br>
        <strong>Motivo:</strong> <span th:text="${cita.motivo != null ? cita.motivo : '-'}">-</span><br>
        <strong>Fecha actual:</strong>
        <span th:text="${#temporals.format(cita.fechaHora, 'dd/MM/yyyy HH:mm')}">-</span>
    </div>

    <form th:if="${cita}" th:action="@{/citas/{id}/reprogramar(id=${cita.id})}" method="post">
        <div class="form-group">
            <label for="nuevaFechaHora">Nueva fecha y hora</label>
            <input type="datetime-local"
                   id="nuevaFechaHora"
                   name="nuevaFechaHora"
                   th:value="${#temporals.format(cita.fechaHora, 'yyyy-MM-dd') + 'T' + #temporals.format(cita.fechaHora, 'HH:mm')}"
                   required>
        </div>
        <button type="submit" class="btn-guardar">Guardar nueva fecha</button>
    </form>

    <a href="/citas" class="link-volver">← Volver al gestor de citas</a>
</div>
</body>
</html>
